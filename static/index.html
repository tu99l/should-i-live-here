<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Should I Live Here?</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div id="map"></div>
  <aside>
    <h1>Should I Live Here?</h1>
    <div class="muted">Each roommate sets what matters. We pick the place that's fairest for everyone.
      Hover a marker for details, or tap it on a phone.</div>

    <h2>Roommates</h2>
    <div id="roommates"></div>
    <button class="secondary" onclick="addRoommate()">+ Add roommate</button>

    <h2>Decide</h2>
    <button onclick="runDecision()">Find the fairest pick</button>
    <div id="result" style="margin-top:10px"></div>

    <h2>Add a listing</h2>
    <textarea id="paste" placeholder="Paste listing text here"></textarea>
    <button class="secondary" onclick="parseListing()">Read listing</button>
    <div id="parseStatus" class="muted"></div>
  </aside>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
